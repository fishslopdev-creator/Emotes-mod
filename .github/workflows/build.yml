name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4

      - name: Use the newest Fabric Loader + Fabric API for this Minecraft version
        run: |
          MC=$(grep '^minecraft_version' gradle.properties | cut -d= -f2)
          LOADER=$(curl -fsS https://meta.fabricmc.net/v2/versions/loader | jq -r '[.[]|select(.stable)][0].version')
          API=$(curl -fsS https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/maven-metadata.xml \
                | grep -o "<version>[^<]*+$MC</version>" | sed 's/<[^>]*>//g' | tail -1)
          echo "Minecraft $MC -> loader $LOADER, fabric-api $API"
          [ -n "$LOADER" ] && sed -i "s/^loader_version=.*/loader_version=$LOADER/" gradle.properties
          [ -n "$API" ] && sed -i "s/^fabric_version=.*/fabric_version=$API/" gradle.properties
          cat gradle.properties

      - name: Build
        run: chmod +x gradlew && ./gradlew build --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: freemotes-jar
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/!(*-sources).jar
